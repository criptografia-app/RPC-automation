---
- name: Check the OS
  assert:
    that:
      - ansible_os_family == "Debian"
      - ansible_service_mgr == "systemd"
    fail_msg: "RPC-automation supports Ubuntu 22.04+/Debian 12+ with systemd. Found {{ ansible_distribution }} {{ ansible_distribution_version }}."

- name: Prefer IPv4 for outbound connections
  lineinfile:
    path: /etc/gai.conf
    line: "precedence ::ffff:0:0/96  100"
    create: true
    mode: "0644"
  when: force_ipv4

- name: Install base packages
  apt:
    name: [curl, ca-certificates, systemd-container, ufw, python3, tar]
    update_cache: true
    cache_valid_time: 3600

- name: Install sdme (verifies release checksums)
  shell: curl -fsSL https://sdme.io/install.sh | sh
  args:
    creates: /usr/local/bin/sdme

- name: Give slow OCI images time to boot
  command: "sdme config set boot_timeout {{ sdme_boot_timeout }}"
  changed_when: false

- name: Import the base rootfs used by every pod
  command: "sdme fs import {{ sdme_base_image }} --name {{ sdme_base_fs }} --install-packages=yes"
  args:
    creates: "/var/lib/sdme/fs/{{ sdme_base_fs }}"

- name: Create state directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop: ["{{ sdme_pod_dir }}", "{{ rpc_data_dir }}"]

# ── Firewall ───────────────────────────────────────────────────────────────
- name: Allow SSH before enabling the firewall
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port | string }}"
    proto: tcp
    comment: ssh
  when: firewall_enabled

- name: Deny incoming by default, allow outgoing
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
  when: firewall_enabled

# ── Host metrics ───────────────────────────────────────────────────────────
- name: Install node_exporter
  shell: |
    set -e
    arch={{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}
    v={{ node_exporter_version }}
    curl -fsSL "https://github.com/prometheus/node_exporter/releases/download/v$v/node_exporter-$v.linux-$arch.tar.gz" | tar -xz -C /tmp
    install -m 0755 "/tmp/node_exporter-$v.linux-$arch/node_exporter" /usr/local/bin/node_exporter
  args:
    creates: /usr/local/bin/node_exporter

- name: Textfile directory for chain metrics
  file:
    path: /var/lib/node_exporter/textfile
    state: directory
    mode: "0755"

- name: node_exporter service
  copy:
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
    content: |
      [Unit]
      Description=Prometheus node_exporter
      After=network-online.target

      [Service]
      User=nobody
      ExecStart=/usr/local/bin/node_exporter --web.listen-address={{ backend_ip if not (colocated_edge | default(inventory_hostname in groups['edge'])) else '127.0.0.1' }}:9100 --collector.textfile.directory=/var/lib/node_exporter/textfile
      Restart=always

      [Install]
      WantedBy=multi-user.target
  notify: restart node_exporter

- name: Start node_exporter
  systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true

- name: Let the gateway scrape node_exporter
  community.general.ufw:
    rule: allow
    port: "9100"
    proto: tcp
    from_ip: "{{ edge_backend_ip }}"
    comment: metrics from gateway
  when: firewall_enabled and not (colocated_edge | default(true)) and inventory_hostname in groups['nodes']
